name: Kernel Release CI

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'lto'
        type: 'choice'
        options:
          - 'default'
          - 'llvm'
          - 'lto'
          - 'pgo-gen'
          - 'pgo-use'
      clean:
        description: 'Run make clean before building'
        required: false
        default: true
        type: 'boolean'
      custom_tag:
        description: 'Custom tag (leave empty for auto-generation)'
        required: false
        default: ''
        type: 'string'
      version_suffix:
        description: 'Custom version suffix'
        required: false
        default: ''
        type: 'string'
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: 'boolean'
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: 'boolean'
      changelog:
        description: 'Changelog text for this release'
        required: false
        default: ''
        type: 'string'
  # Weekly build on Monday at 2:00 AM UTC
  schedule:
    - cron: '0 2 * * 1'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
    env:
      NUM_JOBS: $(nproc)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags and branches

      - name: Set default inputs for scheduled runs
        if: github.event_name == 'schedule'
        run: |
          echo "SCHEDULED_BUILD=true" >> $GITHUB_ENV
          echo "BUILD_MODE=lto" >> $GITHUB_ENV
          echo "CLEAN_BUILD=true" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=weekly" >> $GITHUB_ENV
          echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          echo "CHANGELOG_TEXT=Weekly automated build $(date '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ccache
          sudo apt-get install -y clang lld llvm llvm-dev
          sudo apt-get install -y bison flex libssl-dev libelf-dev
      
      - name: Build kernel
        id: build_kernel
        run: |
          # Make scripts executable
          chmod +x scripts/kernel-build
          
          # Set clean option based on input or scheduled default
          CLEAN_OPTION=""
          if [ "${{ inputs.clean }}" == "true" ] || [ "$CLEAN_BUILD" == "true" ]; then
            CLEAN_OPTION="--clean"
          fi
          
          # Build kernel with LTO mode by default or selected mode
          BUILD_MODE="${{ inputs.build_mode || env.BUILD_MODE || 'lto' }}"
          
          # Set version suffix if provided
          VERSION_SUFFIX_OPTION=""
          if [ -n "${{ inputs.version_suffix }}" ]; then
            VERSION_SUFFIX_OPTION="--version-suffix ${{ inputs.version_suffix }}"
          elif [ -n "$VERSION_SUFFIX" ]; then
            VERSION_SUFFIX_OPTION="--version-suffix $VERSION_SUFFIX"
          fi
          
          ./scripts/kernel-build --mode $BUILD_MODE -v $CLEAN_OPTION $VERSION_SUFFIX_OPTION -j$NUM_JOBS
          
          # Find the generated kernel tarball
          TARBALL=$(find . -maxdepth 1 -name "pamir-ai-kernel-*.tar.gz" -type f -printf "%T@ %p\n" | sort -nr | head -n1 | cut -d' ' -f2-)
          echo "KERNEL_TARBALL=${TARBALL}" >> $GITHUB_ENV
          
          # Extract version from tarball name
          TARBALL_NAME=$(basename "${TARBALL}")
          if [[ "${TARBALL_NAME}" =~ pamir-ai-kernel-(.*)\.tar\.gz ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "KERNEL_VERSION=${VERSION}" >> $GITHUB_ENV
          else
            echo "ERROR: Could not extract version from tarball name: ${TARBALL_NAME}"
            exit 1
          fi
          
          # Create kernel-install script for the release
          if [ -f "scripts/kernel-install" ]; then
            cp "scripts/kernel-install" "kernel-install"
            chmod +x "kernel-install"
            echo "INSTALLER_INCLUDED=true" >> $GITHUB_ENV
          else
            echo "WARNING: No kernel-install script found"
            echo "INSTALLER_INCLUDED=false" >> $GITHUB_ENV
          fi
          
      - name: Prepare release notes
        id: release_notes
        run: |
          # Create release notes file
          NOTES_FILE="release-notes.md"
          
          # Include kernel version info if available
          if [[ -f "out/boot/kernel-version-info" ]]; then
            echo "## Kernel Information" >> $NOTES_FILE
            echo "" >> $NOTES_FILE
            echo '```' >> $NOTES_FILE
            cat "out/boot/kernel-version-info" >> $NOTES_FILE
            echo '```' >> $NOTES_FILE
            echo "" >> $NOTES_FILE
          fi
          
          # Add changelog section if provided
          if [[ -n "${{ inputs.changelog }}" || -n "$CHANGELOG_TEXT" ]]; then
            echo "## Changelog" >> $NOTES_FILE
            echo "" >> $NOTES_FILE
            
            if [[ -n "${{ inputs.changelog }}" ]]; then
              echo "${{ inputs.changelog }}" >> $NOTES_FILE
            elif [[ -n "$CHANGELOG_TEXT" ]]; then
              echo "$CHANGELOG_TEXT" >> $NOTES_FILE
            fi
            echo "" >> $NOTES_FILE
          fi
          
          # Add standard installation instructions
          echo "## Installation" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "### Option 1: Using the install script" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "1. Download both the tarball and kernel-install script" >> $NOTES_FILE
          echo "2. Run the installer with root privileges:" >> $NOTES_FILE
          echo '```' >> $NOTES_FILE
          echo "sudo ./kernel-install pamir-ai-kernel-$KERNEL_VERSION.tar.gz" >> $NOTES_FILE
          echo '```' >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          echo "### Option 2: Manual installation" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "1. Download the tarball" >> $NOTES_FILE
          echo "2. Extract: \`tar -xzvf pamir-ai-kernel-$KERNEL_VERSION.tar.gz\`" >> $NOTES_FILE
          echo "3. Copy files to your Raspberry Pi:" >> $NOTES_FILE
          echo '```' >> $NOTES_FILE
          echo "# Copy kernel and device tree files" >> $NOTES_FILE
          echo "sudo cp -r out/boot/kernel*.img /boot/firmware/" >> $NOTES_FILE
          echo "sudo cp -r out/boot/*.dtb /boot/firmware/" >> $NOTES_FILE
          echo "sudo cp -r out/boot/overlays/*.dtbo /boot/firmware/overlays/" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "# Copy kernel modules" >> $NOTES_FILE
          echo "sudo cp -r out/lib/modules/* /lib/modules/" >> $NOTES_FILE
          echo '```' >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "4. Reboot: \`sudo reboot\`" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          # Add build info
          echo "## Build Information" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "Built using the Pamir AI kernel build script." >> $NOTES_FILE
          echo "Build date: $(date '+%Y-%m-%d %H:%M:%S')" >> $NOTES_FILE
          echo "Build mode: ${{ inputs.build_mode || env.BUILD_MODE || 'lto' }}" >> $NOTES_FILE
          
          # Save release notes path
          echo "NOTES_FILE=${NOTES_FILE}" >> $GITHUB_ENV
          
          # Generate tag name
          if [[ -n "${{ inputs.custom_tag }}" ]]; then
            TAG_NAME="${{ inputs.custom_tag }}"
          else
            # Default tag format: v<date>-<version>
            TAG_NAME="v$(date +'%Y%m%d')-${KERNEL_VERSION}"
          fi
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          
          # Generate release title
          RELEASE_TITLE="Pamir AI Kernel ${KERNEL_VERSION}"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
     
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ env.NOTES_FILE }}
          draft: ${{ inputs.draft || env.IS_DRAFT == 'true' }}
          prerelease: ${{ inputs.prerelease || env.IS_PRERELEASE == 'true' }}
          files: |
            ${{ env.KERNEL_TARBALL }}
            ${{ env.INSTALLER_INCLUDED == 'true' && 'kernel-install' || '' }}
          token: ${{ github.token }}
