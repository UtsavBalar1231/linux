%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/pamir-ai,sam.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Pamir AI Signal Aggregation Module (SAM)

maintainers:
  - Pamir AI Support <support@pamir.ai>

description: |
  The Pamir AI Signal Aggregation Module (SAM) is a communication protocol
  used to interface between a Linux host system and the RP2040 microcontroller
  in Pamir AI CM5 devices. This protocol enables bidirectional communication
  for hardware control and status reporting via UART.
  
  The SAM protocol handles buttons, LEDs, power management, display control,
  and system commands using a compact 4-byte packet format with checksum validation.

properties:
  compatible:
    const: pamir-ai,sam

  debug-level:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3]
    default: 0
    description: |
      Debug level for kernel messages:
      0 = Off (no debug messages)
      1 = Error (error messages only)
      2 = Info (basic info + errors)
      3 = Verbose (detailed protocol information)

  ack-required:
    type: boolean
    default: false
    description: |
      Whether protocol commands require acknowledgment.
      Currently not implemented, for future use.

  recovery-timeout-ms:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 1000
    description: |
      Timeout in milliseconds for protocol recovery.
      Used if a packet transmission stalls.

  power-poll-interval-ms:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 1000
    description: |
      Interval in milliseconds for polling power metrics from the RP2040.
      Set to 0 to disable polling.

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sdm845.h>

    serial@78b0000 {
        compatible = "qcom,msm-uartdm-v1.4", "qcom,msm-uartdm";
        reg = <0x78b0000 0x200>;
        interrupts = <0 108 0>;
        clocks = <&gcc GCC_BLSP1_UART2_APPS_CLK>,
                <&gcc GCC_BLSP1_AHB_CLK>;
        clock-names = "core", "iface";
        status = "okay";
        
        pamir_sam: pamir-sam {
            compatible = "pamir-ai,sam";
            debug-level = <2>;
            power-poll-interval-ms = <1000>;
        };
    };
