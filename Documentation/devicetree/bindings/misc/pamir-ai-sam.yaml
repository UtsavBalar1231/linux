%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/pamir-ai-sam.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Pamir AI Signal Aggregation Module (SAM) Device Tree Bindings

maintainers:
  - Utsav Balar <utsavbalar1231@gmail.com>

description: |
  This binding describes the Pamir AI Signal Aggregation Module (SAM) overlay which
  enables communication between the host processor and an RP2040 microcontroller
  providing interface to hardware inputs and outputs on CM5 devices.
  
  The SAM module communicates over UART and provides an input interface for buttons,
  LED control functionality, power state management, and debugging capabilities.
  It also provides a character device interface (/dev/pamir-sam) for user-space
  applications to communicate directly with the microcontroller.

properties:
  compatible:
    const: pamir-ai,sam

  status:
    enum:
      - okay
      - disabled

  debug-level:
    type: integer
    default: 1
    description: |
      Debug verbosity level:
      0 - No debug messages (SAM_DEBUG_OFF)
      1 - Error messages only (SAM_DEBUG_ERROR)
      2 - Basic informational messages + errors (SAM_DEBUG_INFO)
      3 - Very verbose debugging with detailed protocol information (SAM_DEBUG_VERBOSE)

  recovery-timeout-ms:
    type: integer
    default: 1000
    description: Timeout in milliseconds for UART communication recovery

  ack-required:
    type: boolean
    description: Require acknowledgement packets for each command sent

required:
  - compatible
  - status

additionalProperties: false

examples:
  - |
    / {
      fragment@0 {
        target = <&uart0>;
        __overlay__ {
          status = "okay";
          pinctrl-names = "default";
          pinctrl-0 = <&uart0_pins>;
        };
      };

      fragment@1 {
        target = <&uart0>;
        __overlay__ {
          pamir_ai_sam: pamir-ai-sam {
            compatible = "pamir-ai,sam";
            status = "okay";
            debug-level = <2>;
            recovery-timeout-ms = <1000>;
            ack-required;
          };
        };
      };
    }; 